<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="이철민의 개인 프로페셔널 웹사이트">
    <title>이철민 · Principal Engineer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="game.js?v=cr3-food-icon" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="홈으로 이동">이철민</a>
      <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false">메뉴</button>
      <nav id="site-nav" class="site-nav" aria-label="주요 메뉴">
        <a href="#top">Home</a>
        <a href="#about">About</a>
        <a href="#games">Games</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main id="top">
      <section id="about" class="hero" aria-labelledby="intro-title">
        <h1 id="intro-title">Welcome to My Claude Project</h1>
        <p class="intro">안정적이고 오래가는 웹 경험을 만듭니다.</p>
      </section>

      <section id="games" class="section" aria-labelledby="games-title">
        <div class="section-heading">
          <p class="eyebrow">Playground</p>
          <h2 id="games-title">Games</h2>
        </div>
        <div class="game-shell" role="region" aria-label="Loop테스트 게임">
          <div class="game-hud" aria-live="polite">
            <span>점수 <strong id="score">0</strong></span>
            <span>생존 시간 <strong id="survival-time">0:00</strong></span>
            <span>최고 점수 <strong id="high-score">0</strong></span>
            <button id="pause-button" class="secondary-button" type="button" disabled>일시정지</button>
          </div>
          <div class="game-board-wrap">
            <canvas id="game-board" width="480" height="480" aria-label="Loop테스트 게임판"></canvas>
            <div id="game-overlay" class="game-overlay" role="dialog" aria-labelledby="game-title" aria-describedby="game-message">
              <h3 id="game-title">Loop테스트</h3>
              <p id="game-message">방향키, WASD 또는 화면 버튼으로 이동하세요.</p>
              <button id="start-button" class="primary-button" type="button">게임 시작</button>
            </div>
          </div>
          <div class="game-status" id="game-status" role="status">게임 시작을 기다리는 중입니다.</div>
          <div class="direction-controls" aria-label="모바일 방향 버튼">
            <span></span><button type="button" data-direction="up" aria-label="위로 이동">▲</button><span></span>
            <button type="button" data-direction="left" aria-label="왼쪽으로 이동">◀</button><button type="button" data-direction="down" aria-label="아래로 이동">▼</button><button type="button" data-direction="right" aria-label="오른쪽으로 이동">▶</button>
          </div>
        </div>
      </section>

      <section id="contact" class="section" aria-labelledby="contact-title">
        <div class="section-heading">
          <p class="eyebrow">Contact</p>
          <h2 id="contact-title">연락처</h2>
        </div>
        <p class="intro">공개 연락처는 제공하지 않습니다.</p>
      </section>
    </main>

    <footer class="site-footer">© 이철민</footer>
  </body>
</html>
